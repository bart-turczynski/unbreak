name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published advisories surface even without a push.
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze (Swift)
    # CodeQL's Swift extractor only runs on macOS, and the build needs the same
    # Swift 6.3 toolchain as CI (see ci.yml) — macos-26 ships Xcode 26.x.
    runs-on: macos-26
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:swift"
